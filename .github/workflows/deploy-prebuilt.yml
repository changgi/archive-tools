name: deploy-prebuilt

# archive-tools MCP 서버(mcp/) 배포 — Vercel 빌드 CPU 0원 경로.
# 빌드는 GitHub 러너에서 `vercel build`로 끝내고(.vercel/output), Vercel에는 `vercel deploy --prebuilt`로 산출물만 올린다.
# 필요한 Repository secret: VERCEL_TOKEN 하나 (vercel.com/account/tokens). 토큰 값은 로그에 남기지 않는다.
# Vercel 프로젝트 Settings → Build and Deployment → Ignored Build Step = "Don't build anything (exit 0)" 로 두면
# Git push 때 Vercel이 중복 빌드하지 않는다. 기계는 Standard.

on:
  push:
    branches: [main]
    paths: ['mcp/**', '.github/workflows/deploy-prebuilt.yml']
  workflow_dispatch:

concurrency:
  group: deploy-prebuilt-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'changgis-projects-22902153' }}
  VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT || 'archive-tools-mcp' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: 의존성 설치
        working-directory: mcp
        run: npm ci --no-audit --no-fund

      - name: Vercel CLI
        run: npm i -g vercel@48

      - name: 프로젝트 연결(없으면 만든다) · 설정 내려받기
        working-directory: mcp
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN secret 이 없습니다 — Settings → Secrets and variables → Actions 에 추가해 주세요."; exit 1
          fi
          vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            || vercel project add "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: 빌드 (Vercel 빌드 머신 미사용)
        working-directory: mcp
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: prebuilt 배포
        id: deploy
        working-directory: mcp
        run: |
          set -euo pipefail
          out=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          printf '%s\n' "$out"
          url=$(printf '%s\n' "$out" | grep -Eo 'https://[^[:space:]]+' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 배포 완료 — https://$VERCEL_PROJECT.vercel.app (커밋 ${GITHUB_SHA::7}, prebuilt)" >> "$GITHUB_STEP_SUMMARY"
          echo "배포 URL(보호됨): ${url:-unknown}" >> "$GITHUB_STEP_SUMMARY"

      # Deployment Protection(Vercel Authentication)은 배포별 URL(*-hash.vercel.app)에만 걸리고
      # 프로덕션 도메인은 공개다. 그래서 실측은 배포 URL이 아니라 프로덕션 앨리어스로 한다.
      - name: 배포 후 실측 (initialize · tools/list · 도구 호출 · 재실행 일치)
        run: |
          set -uo pipefail
          base="https://$VERCEL_PROJECT.vercel.app"
          for i in $(seq 1 12); do
            curl -sS -o /dev/null -m 20 -X POST "$base/api/mcp" -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' && break
            sleep 10
          done
          python3 mcp/scripts/verify_endpoint.py --url "$base/api/mcp" --repeat 2 --skip-live
          echo "- 운영 점검: $base/api/mcp — verify_endpoint.py PASS" >> "$GITHUB_STEP_SUMMARY"
