name: deploy-prebuilt

# Vercel Build CPU 과금을 0으로 만드는 배포 경로 — mcp/(원격 MCP 서버) 전용.
# 빌드는 GitHub Actions 러너에서 `vercel build`로 끝내고(.vercel/output), Vercel에는
# `vercel deploy --prebuilt`로 산출물만 올린다. Vercel 빌드 머신은 쓰지 않는다.
# Vercel 프로젝트 쪽 Settings → Build and Deployment → Ignored Build Step 은
# "Don't build anything (exit 0)" 으로 두어 Git push 때 중복 빌드가 돌지 않게 한다.
#
# 필요한 Repository secret: VERCEL_TOKEN (vercel.com/account/tokens 에서 만든 토큰)
# 선택 Repository variable: VERCEL_SCOPE (기본 changgis-projects-22902153) · VERCEL_PROJECT (기본 archive-tools-mcp)
# 토큰 값은 로그·파일 어디에도 남기지 않는다(CLI에 환경변수로만 넘긴다).

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/deploy-prebuilt.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prebuilt-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'changgis-projects-22902153' }}
  VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT || 'archive-tools-mcp' }}

jobs:
  deploy:
    name: GitHub 빌드 → Vercel prebuilt 배포
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 24 (mcp/package.json engines와 동일)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund
        working-directory: mcp

      - name: 데이터셋이 저장소 산출물과 같은지
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 mcp/scripts/build_dataset.py
          git diff --exit-code -- mcp/data/curation.json mcp/data/glossary.json \
            || { echo "::error::mcp/data 가 examples 산출물과 다릅니다 — python3 mcp/scripts/build_dataset.py 후 커밋하세요"; exit 1; }

      - name: Vercel CLI
        run: npm i -g vercel@48

      - name: Vercel 프로젝트 연결 (없으면 만든다)
        working-directory: mcp
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN secret 이 없습니다 — 저장소 Settings → Secrets and variables → Actions 에 추가해 주세요."; exit 1
          fi
          vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
            || vercel project add "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          test -f .vercel/project.json && vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: 빌드 (로컬에서 .vercel/output 생성 — Vercel 빌드 머신 미사용)
        working-directory: mcp
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: prebuilt 산출물 배포 (빌드 없이 업로드만)
        id: deploy
        working-directory: mcp
        run: |
          set -euo pipefail
          out=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          printf '%s\n' "$out"
          url=$(printf '%s\n' "$out" | grep -Eo 'https://[^[:space:]]+' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### 배포 완료"
            echo "- 배포 URL: ${url:-unknown}"
            echo "- 커밋: \`${GITHUB_SHA::7}\`"
            echo "- Vercel 빌드 사용: 없음 (prebuilt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 배포 후 실측 — initialize · tools/list · 주요 도구 · 재실행 일치
        run: |
          set -uo pipefail
          url="${{ steps.deploy.outputs.url }}"
          base="${url:-https://$VERCEL_PROJECT.vercel.app}"
          for i in $(seq 1 12); do
            if curl -sS -o /dev/null -m 20 -X POST "$base/api/mcp" \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'; then break; fi
            sleep 10
          done
          python3 mcp/scripts/verify_endpoint.py --url "$base/api/mcp" --repeat 2 --skip-live
          echo "- 운영 점검: $base/api/mcp · verify_endpoint.py PASS" >> "$GITHUB_STEP_SUMMARY"
